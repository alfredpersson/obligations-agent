entries:
  # personal_data, European Commission, "Data protection explained"

  - id: pieces_of_information
    slot: personal_data
    source: ec_data_protection_explained
    two_sided: false
    quotes:
      - heading: What is personal data?
        text: >-
          Different pieces of information, which together can lead to the identification of a
          particular person, may also be considered personal data.

  - id: pseudonymised_data
    slot: personal_data
    source: ec_data_protection_explained
    two_sided: true
    quotes:
      - heading: What is personal data?
        text: >-
          Personal data that has been de-identified, encrypted or pseudonymised but can be used to
          re-identify a person remains personal data and falls within the scope of the General Data
          Protection Regulation (GDPR), the EU's main data protection law.
      - heading: Examples of data that is not considered personal data
        text: anonymised data, if anonymisation is irreversible

  - id: home_address
