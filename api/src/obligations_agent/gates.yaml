  - { gate: controller, unit: "gdpr:art12(2)", label: "Support for the rights of the people whose data it is", category: technical, date: gdpr }
  - { gate: controller, unit: "gdpr:art13(1)", label: "Information to people whose data is collected from them", category: legal, date: gdpr, drafting: true }
  - { gate: controller, unit: "gdpr:art14(1)", label: "Information to people whose data comes from elsewhere", category: legal, date: gdpr, drafting: true }
  - { gate: controller, unit: "gdpr:art25(1)", label: "Data protection by design and by default", category: technical, date: gdpr }
  - { gate: controller, unit: "gdpr:art28(1)", label: "Only processors with sufficient guarantees", category: organisation, date: gdpr }
  - { gate: controller, unit: "gdpr:art32(1)", label: "Security of processing", category: technical, date: gdpr }
  - { gate: controller, unit: "gdpr:art33(1)", label: "A breach reported to the supervisory authority", category: organisation, date: gdpr }
  - { gate: controller, unit: "gdpr:art35(1)", label: "An impact assessment where a high risk is likely", category: legal, date: gdpr }
  - { gate: controller, unit: "gdpr:art9(1)", label: "Special categories only under an exception in Article 9(2)", category: legal, date: gdpr, needs: { slot: special_categories } }
  - { gate: controller, unit: "gdpr:art22(1)", label: "Solely automated decisions only under Article 22(2)", category: legal, date: gdpr, needs: { slot: automated_decisions } }
  - { gate: processor, unit: "gdpr:art28(3)", label: "A contract with the controller (data processing agreement)", category: legal, date: gdpr, drafting: true }
  - { gate: processor, unit: "gdpr:art28(2)", label: "Other processors only with the controller's authorisation", category: legal, date: gdpr, drafting: true }
  - { gate: processor, unit: "gdpr:art32(1)", label: "Security of processing", category: technical, date: gdpr }
  - { gate: processor, unit: "gdpr:art33(2)", label: "A breach reported to the controller", category: organisation, date: gdpr }
  - { gate: provider, unit: "aia:art4(1)", label: "AI literacy of staff", category: organisation, date: chapter_i }
  - { gate: transparency_interaction, unit: "aia:art50(5)", label: "Information at the first interaction", category: technical, date: general }
  - { gate: transparency_content, unit: "aia:art50(2)", label: "Machine-readable marking of generated content", category: technical, date: generated_content }
  - { gate: high_risk_annex_iii, unit: "aia:art9(1)", label: "A risk management system", category: organisation, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art10(2)", label: "Data governance for training, validation and testing data", category: technical, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art11(1)", label: "Technical documentation", category: technical, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art12(1)", label: "Automatic logs", category: technical, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art13(1)", label: "Information for deployers", category: technical, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art14(1)", label: "Human oversight", category: technical, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art15(1)", label: "Accuracy, robustness and cybersecurity", category: technical, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art17(1)", label: "A quality management system", category: legal, date: annex_iii, needs: { gate: provider }, drafting: true }
  - { gate: high_risk_annex_iii, unit: "aia:art43(1)", label: "Conformity assessment for biometrics", category: organisation, date: annex_iii, needs: { gate: provider }, values: [biometrics] }
  - { gate: high_risk_annex_iii, unit: "aia:art43(2)", label: "Conformity assessment", category: organisation, date: annex_iii, needs: { gate: provider }, values: [critical_infrastructure, education, employment, essential_services, law_enforcement, migration, justice] }
  - { gate: high_risk_annex_iii, unit: "aia:art49(1)", label: "Registration in the EU database", category: organisation, date: annex_iii, needs: { gate: provider }, values: [biometrics, education, employment, essential_services, law_enforcement, migration, justice] }
  - { gate: high_risk_annex_iii, unit: "aia:art49(5)", label: "Registration at national level", category: organisation, date: annex_iii, needs: { gate: provider }, values: [critical_infrastructure] }
  - { gate: high_risk_annex_iii, unit: "aia:art72(1)", label: "Post-market monitoring", category: organisation, date: annex_iii, needs: { gate: provider } }
  - { gate: high_risk_annex_iii, unit: "aia:art73(1)", label: "Reports of serious incidents", category: organisation, date: annex_iii, needs: { gate: provider } }
  - { gate: deployer, unit: "aia:art4(1)", label: "AI literacy of staff", category: organisation, date: chapter_i }
  - { gate: deployer, unit: "aia:art26(1)", label: "Use according to the instructions for use", category: organisation, date: annex_iii, needs: { gate: high_risk_annex_iii } }
  - { gate: deployer, unit: "aia:art26(2)", label: "Human oversight by people with the needed competence", category: organisation, date: annex_iii, needs: { gate: high_risk_annex_iii } }
  - { gate: deployer, unit: "aia:art26(5)", label: "Monitoring, and informing the provider of risks", category: organisation, date: annex_iii, needs: { gate: high_risk_annex_iii } }
  - { gate: deployer, unit: "aia:art26(6)", label: "Keeping the logs", category: technical, date: annex_iii, needs: { gate: high_risk_annex_iii } }
  - { gate: deployer, unit: "aia:art26(7)", label: "Informing workers' representatives and the affected workers", category: organisation, date: annex_iii, needs: { gate: high_risk_annex_iii } }
  - { gate: deployer, unit: "aia:art26(11)", label: "Informing the people that the system makes decisions about", category: legal, date: annex_iii, needs: { gate: high_risk_annex_iii }, drafting: true }
