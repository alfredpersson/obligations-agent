# The fact schema (FACT-1 in docs/spec.md). Every slot has an id, a label, a
# question, the allowed values, a relevance condition and the unit that defines
# it, and every slot has the value not_sure (FACT-2). The description fields are
# the text that the user writes (FACT-4). The ids of the description fields and
# the slots are unique together, and so are the value ids within a slot. Quote
# yes, no, Yes and No: without quotes, PyYAML reads them as true and false.

description:
  - id: what_it_does
    label: What it does
    question: What does the product do?
    max_length: 500
  - id: who_uses_it
    label: Who uses it
    question: "Who uses the product? If it also talks to or makes decisions about other people, name them too. For example, a company uses a chatbot to answer its own customers."
    max_length: 500
  - id: data_it_handles
    label: What data it handles
    question: What data does the product handle?
    max_length: 500

slots:
  - id: personal_data
    label: Personal data
    question: Does the product process personal data?
    relevant: always
    unit: "gdpr:art4(1)"
    values:
      - { id: "yes", label: "Yes" }
      - { id: "no", label: "No" }
      - { id: not_sure, label: Not sure }

  - id: under_own_name
    label: Under own name or trademark
    question: Do you place the product on the market or put it into service under your own name or trademark?
    relevant: always
    unit: "aia:art3(3)"
    values:
      - { id: "yes", label: "Yes" }
      - { id: "no", label: "No" }
      - { id: not_sure, label: Not sure }

  - id: use_case_area
    label: Use-case area
    question: Which of these areas is the product intended to be used in?
    relevant: always
    unit: "aia:art6(2)"
    values:
      - { id: biometrics, label: Biometrics }
      - { id: critical_infrastructure, label: Critical infrastructure }
      - { id: education, label: Education and vocational training }
      - { id: employment, label: "Employment, workers' management and access to self-employment" }
      - { id: essential_services, label: Access to and enjoyment of essential private services and essential public services and benefits }
      - { id: law_enforcement, label: Law enforcement }
      - { id: migration, label: "Migration, asylum and border control management" }
      - { id: justice, label: Administration of justice and democratic processes }
      - { id: none, label: None of these }
      - { id: not_sure, label: Not sure }
